[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "gxi-tenk10k"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "PyYAML==6.0.2", "numpy==2.2.6", "scipy==1.15.3", "pandas==2.2.3", "pyarrow==19.0.1", "matplotlib==3.10.3", "pysam==0.23.3", "duckdb==1.3.2", "reportlab==4.4.3"]
[project.optional-dependencies]
dev = ["pytest==8.3.5"]
[project.scripts]
gxi-tenk10k = "gxi_tenk10k.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
