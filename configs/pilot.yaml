# Prespecified parameters; Codex must implement parser and validate against real metadata.
study:
  name: gxi-tenk10k-zero-shot
  genome_build: GRCh38
  seed: 20261029
  primary_effect: alt_minus_ref_log_tpm1
  unit: log_tpm1
sources:
  zenodo_record_id: 18221260
  initial_archives:
    - common_variant_gene_level_results_with_annotated_fails.zip
    - susie_summary.zip
  additional_on_demand:
    - common_all_cis_pvalues_100kb.zip
  download_large_files: false
paths:
  raw: data/raw
  cache: data/cache
  processed: data/processed
  results: results
selection:
  target_variant_gene_pairs: 100
  matched_control_pairs: 100
  smoke_variant_gene_pairs: 2
  trial_variant_gene_pairs: 20
  min_pip_preferred: 0.90
  min_pip_fallback: 0.50
  max_cell_types_per_pair: 4
  require_snv: true
  require_reference_match: true
  require_effective_scored_window_coverage: true
  require_oriented_beta: true
  requested_cell_types:
    - B naive
    - CD4 naive T
    - CD14 classical monocyte
    - CD16 nonclassical monocyte
models:
  primary: g0-expression-8192
  secondary: g0-expression
  context_template: "Human peripheral blood {cell_type}, unstimulated, 10x 3-prime single-cell RNA-seq"
api:
  base_url_env: GI_BASE_URL
  key_env: GI_API_KEY
  concurrency: 2
  timeout_seconds: 120
  max_retries: 5
  max_requests: 1600
  cache_enabled: true
  cost_preflight_required: true
analysis:
  cluster_unit: locus
  bootstrap_replicates: 2000
  near_zero_delta_epsilon: 0.000001
  confidence_level: 0.95
  permutation_replicates: 1000
  holdout_by_locus: true
